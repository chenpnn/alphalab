[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphalab"
version = "0.1.0"
description = "Personal quantitative research toolkit"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "nn"}]
keywords = ["quant", "backtest", "finance"]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "cvxpy>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ipykernel",
    "ruff",
]
plot = [
    "plotly>=5.0",
    "seaborn>=0.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["alphalab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py39"
